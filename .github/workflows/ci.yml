name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build freshness check
        run: node scripts/build.mjs --check
      - name: Smoke test
        run: node scripts/smoke.mjs
